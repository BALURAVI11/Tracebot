version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oliveai-telemetry-core
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - sqlite-data:/app/prisma
    restart: always

volumes:
  sqlite-data:
