apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oliveai-sqlite-pvc
  labels:
    app: oliveai-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oliveai-deployment
  labels:
    app: oliveai-app
spec:
  replicas: 1 # SQLite utilizes file-level locking, thus single-replica deployments avoid lock contentions.
  selector:
    matchLabels:
      app: oliveai-app
  template:
    metadata:
      labels:
        app: oliveai-app
    spec:
      containers:
        - name: oliveai-container
          image: oliveai-telemetry-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_APP_URL
              value: "http://localhost:3000"
            - name: GEMINI_API_KEY
              value: "" # Expose Gemini Key or reference a Kubernetes Secret
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: oliveai-sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: oliveai-service
  labels:
    app: oliveai-app
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: oliveai-app
